# HPL-1 research configuration (validated on load; live_trading_enabled is
# rejected outright — this codebase has NO live-order execution client).
research:
  market: futures            # spot | futures (never mixed)
  symbol: BTCUSDT            # futures profile symbol (spot: BTCFDUSD)
  start_date: "2024-03-25"   # futures bookTicker archives end 2024-03-30
  end_date: "2024-03-29"
  data_types: [bookTicker, aggTrades, fundingRate]   # spot auto-reduces to [aggTrades]
  train_fraction: 0.60
  validation_fraction: 0.20  # final 20% is the untouched test split
  purge_seconds: 1
  embargo_seconds: 30
  models: [zero, ridge, logistic, hist, law, regime]
  random_seed: 13
  raw_dir: data/raw
  processed_dir: data/processed
  artifacts_dir: artifacts/research
  large_download_allow_mb: 500    # downloads above this require --yes
  max_download_concurrency: 4

costs:
  taker_fee_bps: 5.0        # REPLACE with your account's actual fee tier
  maker_fee_bps: 2.0
  slippage_bps: 1.0
  use_spread: true
  fee_scenario: user        # user | zero (explicit research scenario) | promo

risk:
  starting_capital: 10000.0
  leverage: 1.0             # capped at 2.0 by the futures profile; spot: 1.0
  position_fraction: 0.5
  max_daily_loss_pct: 3.0
  max_drawdown_pct: 10.0
  cooldown_seconds: 10
  max_turnover_per_day: 10.0
  min_edge_bps: 0.5
  stale_quote_max_seconds: 30.0
