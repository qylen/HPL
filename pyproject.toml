[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpl1-crypto-research"
version = "0.1.0"
description = "Research pipeline for testing one-second crypto order-flow predictive hypotheses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hpl1 = "hpl1.cli:main"

[tool.setuptools.packages.find]
include = ["hpl1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
